<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Plan enquiry registration</title>
  </head>
  <body>
    <form
      name="plan-interest"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="plan-interest" />
      <input name="subject" />
      <input name="plan" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="company" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
