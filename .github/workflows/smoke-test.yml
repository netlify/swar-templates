name: Smoke test starters

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Smoke
        env:
          STRIPE_SECRET_KEY: sk_test_dummy_ci_key
          SITE_URL: http://localhost:8787
        run: node scripts/smoke.test.mjs

      - name: Check Basic
        working-directory: starters/basic
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test

      - name: Check SaaS
        working-directory: starters/saas
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test

      - name: Check Resume
        working-directory: starters/resume
        run: |
          npm run typecheck
          npm run format:check
          npm test

      - name: Check Calculator
        working-directory: starters/calculator
        run: |
          npm run typecheck
          npm run format:check
          npm test

      - name: Check Blog
        working-directory: starters/blog
        run: |
          npm run typecheck
          npm run format:check
          npm test
